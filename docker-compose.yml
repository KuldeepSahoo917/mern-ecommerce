services:
  backend:
    image: mern-ecommerce-backend:latest
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    image: mern-ecommerce-frontend:latest
    container_name: mern-frontend
    ports:
      - "3002:80"
    restart: unless-stopped

  admin:
    image: mern-ecommerce-admin:latest
    container_name: mern-admin
    ports:
      - "3001:80"
    restart: unless-stopped
